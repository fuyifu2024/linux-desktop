name: Source and package checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y desktop-file-utils shellcheck
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m compileall -q src scripts tests
      - run: bash -n scripts/*.sh
      - run: shellcheck scripts/*.sh
      - run: desktop-file-validate config/*.desktop
      - run: python3 scripts/build-deb.py
      - run: dpkg-deb --info build/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-package-${{ runner.arch }}
          path: build/*.deb
